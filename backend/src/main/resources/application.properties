spring.application.name=oneboard
server.port=${PORT:8085}

# --- Database (file-based H2 for local dev; swap for PostgreSQL later) ---
spring.datasource.url=jdbc:h2:file:./data/oneboard
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- Uploads ---
spring.servlet.multipart.max-file-size=5MB

# --- Frontend: the browser re-checks index.html / app.js / styles.css on every load
# (cheap 304 when unchanged), so UI updates show up without a hard refresh ---
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Aggregation ---
# Periodic refresh from all sources (off by default)
oneboard.aggregation.schedule-enabled=false
oneboard.aggregation.cron=0 0 */6 * * *
oneboard.aggregation.default-queries=java,backend
oneboard.aggregation.http-timeout=20s

# --- Jooble partner API: Azerbaijani vacancies (enabled when JOOBLE_API_KEY is set) ---
# Request a key at https://az.jooble.org/api/about (free plan: 100 requests/day)
oneboard.jooble.api-key=${JOOBLE_API_KEY:}
oneboard.jooble.base-url=https://az.jooble.org
oneboard.jooble.location=Azərbaycan

# --- CV adaptation via Claude (enabled when ANTHROPIC_API_KEY is set) ---
oneboard.claude.api-key=${ANTHROPIC_API_KEY:}
oneboard.claude.model=claude-opus-5-5
oneboard.claude.max-tokens=16000
